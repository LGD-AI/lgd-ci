name: lgd-reusable-ci
on:
  workflow_call:
    inputs:
      python-version:
        type: string
        default: "3.11"
      run-tests:
        type: boolean
        default: true
      require-skill-md:
        type: boolean
        default: false
permissions:
  contents: read

jobs:
  ci:
    name: lgd-ci
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ inputs.python-version }}
      - name: Verify layout
        run: |
          set -e
          if [ ! -f SKILL.md ]; then
            if [ "true" = "true" ]; then
              echo "no SKILL.md at repo root - treated as a non-skill repo"
              exit 0
            fi
          fi
          if [ -f SKILL.md ]; then
            head -n 1 SKILL.md | grep -q '^---' || { echo "::error::SKILL.md must start with YAML front matter"; exit 1; }
            grep -qi '^name:' SKILL.md || { echo "::error::SKILL.md missing name field"; exit 1; }
            grep -qi '^description:' SKILL.md || { echo "::error::SKILL.md missing description field"; exit 1; }
            echo "SKILL.md front matter OK"
          fi
          echo "layout OK"
      - name: JSON sanity
        run: |
          set -e
          bad=0
          files=$(find . -name '*.json' -not -path './.git/*' | head -n 50)
          for f in $files; do
            python -c "import json,sys;json.load(open(sys.argv[1]))" "$f" || bad=1
          done
          exit $bad
      - name: Tests
        if: ${{ inputs.run-tests }}
        run: |
          set -e
          if [ -d tests ]; then
            python -m pip install --upgrade pip
            if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
            python -m pytest -q
          else
            echo "no tests directory - skipped"
          fi