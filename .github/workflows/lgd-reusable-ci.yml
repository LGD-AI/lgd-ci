name: lgd-reusable-ci
on:
  workflow_call:
    inputs:
      python-version:
        type: string
        default: "3.11"
      run-tests:
        type: boolean
        default: false
      require-skill-md:
        type: boolean
        default: false
permissions:
  contents: read

jobs:
  ci:
    name: lgd-ci
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ inputs.python-version }}
      - name: Verify layout
        run: |
          set -e
          if [ -f SKILL.md ]; then
            head -n 1 SKILL.md | grep -q '^---' || { echo "::error::SKILL.md must start with YAML front matter"; exit 1; }
            grep -qi '^name:' SKILL.md || { echo "::error::SKILL.md missing name field"; exit 1; }
            grep -qi '^description:' SKILL.md || { echo "::error::SKILL.md missing description field"; exit 1; }
            echo "SKILL.md front matter OK"
          else
            echo "no SKILL.md at root - non-skill repo, layout check skipped"
          fi
      - name: JSON sanity
        run: |
          bad=0
          checked=0
          skipped=0
          while IFS= read -r f; do
            out=$(python -c "import json,sys;s=open(sys.argv[1],encoding='utf-8-sig').read().strip();json.loads(s) if s else print('EMPTY')" "$f" 2>&1) \
              || { echo "::error file=$f::invalid JSON"; echo "$out"; bad=1; continue; }
            case "$out" in *EMPTY*) skipped=$((skipped+1));; *) checked=$((checked+1));; esac
          done <<EOF
          $(find . -name '*.json' -not -path './.git/*' \
              -not -path '*/fixtures/*' -not -path '*/fixture/*' \
              -not -path '*/invalid/*' -not -path '*/negative/*' \
              -not -path '*/testdata/*' -not -path '*/examples/broken/*' \
              -not -path '*/node_modules/*' | sort | head -n 200)
          EOF
          echo "checked=$checked skipped_empty=$skipped"
          exit $bad
      - name: Tests
        if: ${{ inputs.run-tests }}
        run: |
          set -e
          if [ -d tests ]; then
            python -m pip install --upgrade pip
            if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
            python -m pytest -q
          else
            echo "no tests directory - skipped"
          fi